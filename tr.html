<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaching Report Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #EE1C25;
      --primary-dark: #c8141c;
      --primary-light: #fff0f1;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      padding: 28px 20px 44px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(238, 28, 37, 0.2);
    }

    .logo-container {
      background: #ffffff;
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.92rem;
      opacity: 0.9;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 960px;
      margin: -24px auto 40px;
      padding: 0 16px;
      flex: 1;
    }

    /* Search & Controls Bar */
    .toolbar {
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .btn-refresh {
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(238, 28, 37, 0.25);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-refresh:hover {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* Grid Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(238, 28, 37, 0.08);
      border-color: rgba(238, 28, 37, 0.4);
    }

    .teacher-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .teacher-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-dark);
    }

    .teacher-role {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-open {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .btn-open:hover {
      background-color: var(--primary-dark);
    }

    /* Status States */
    .status-box {
      text-align: center;
      padding: 48px 20px;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @media (max-width: 540px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-refresh {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img 
        src="https://lh3.googleusercontent.com/d/1xp4tsE6RhaxXFSC7XQN45_3TOdUsUe5j" 
        onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=1xp4tsE6RhaxXFSC7XQN45_3TOdUsUe5j&sz=w400';"
        alt="Logo BBC">
    </div>
    <h1>Teaching Report Center</h1>
    <p>Portal Akses Laporan Mengajar Guru</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="search-box">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Cari nama teacher..." onkeyup="filterTeachers()">
      </div>
      <button class="btn-refresh" onclick="loadSpreadsheetData()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
          <path d="M16 16h5v5"></path>
        </svg>
        Sync Data
      </button>
    </div>

    <div id="contentArea">
      <div class="status-box">
        <div class="spinner"></div>
        <p>Memuat data dari Google Spreadsheet...</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> BBC Teaching Report System
  </footer>

  <script>
    const SPREADSHEET_ID = '1SZa9Pc3uwvd6EcZk1SQaEkaI79MCbzLrtR71okw__vI';
    const SHEET_NAME = 'TR';
    let allTeachers = [];

    document.getElementById('year').textContent = new Date().getFullYear();

    function getInitials(name) {
      const cleaned = name.replace(/^(Mr\.|Ms\.|Mrs\.|Miss)\s*/i, '').trim();
      const parts = cleaned.split(' ');
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return cleaned.substring(0, 2).toUpperCase();
    }

    function renderCards(data) {
      const contentArea = document.getElementById('contentArea');

      if (data.length === 0) {
        contentArea.innerHTML = `
          <div class="status-box">
            <p>Data teacher tidak ditemukan.</p>
          </div>
        `;
        return;
      }

      const cardsHTML = data.map(item => `
        <div class="card">
          <div class="teacher-info">
            <div class="avatar">${getInitials(item.name)}</div>
            <div>
              <div class="teacher-name">${item.name}</div>
              <div class="teacher-role">Teaching Report</div>
            </div>
          </div>
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-open">
            <span>Buka Report</span>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </div>
      `).join('');

      contentArea.innerHTML = `<div class="grid">${cardsHTML}</div>`;
    }

    function filterTeachers() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allTeachers.filter(t => t.name.toLowerCase().includes(keyword));
      renderCards(filtered);
    }

    // Callback JSONP yang dipanggil otomatis oleh Google Sheets
    window.handleSheetResponse = function(json) {
      try {
        if (!json || json.status === 'error' || !json.table) {
          throw new Error('Respons spreadsheet tidak valid');
        }

        const rows = json.table.rows || [];
        allTeachers = rows
          .map(row => {
            const name = row.c && row.c[0] && row.c[0].v ? String(row.c[0].v).trim() : '';
            const link = row.c && row.c[1] && row.c[1].v ? String(row.c[1].v).trim() : '';
            return { name, link };
          })
          .filter(item => item.name && item.link && item.name.toLowerCase() !== 'teacher');

        filterTeachers();
      } catch (error) {
        console.error('Error parsing sheet:', error);
        showError();
      }
    };

    function showError() {
      document.getElementById('contentArea').innerHTML = `
        <div class="status-box">
          <p style="color: #EE1C25; font-weight: 600; margin-bottom: 6px;">Gagal memuat data spreadsheet</p>
          <p style="font-size: 0.88rem;">Pastikan nama tab adalah <strong>TR</strong> dan akses file diatur ke <strong>"Anyone with the link" (Viewer)</strong>.</p>
        </div>
      `;
    }

    function loadSpreadsheetData() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `
        <div class="status-box">
          <div class="spinner"></div>
          <p>Menyinkronkan data terbaru...</p>
        </div>
      `;

      // Hapus script lama jika ada (saat tombol Sync Data diklik)
      const oldScript = document.getElementById('google-sheet-jsonp');
      if (oldScript) {
        oldScript.remove();
      }

      const script = document.createElement('script');
      script.id = 'google-sheet-jsonp';
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetResponse&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
      script.onerror = showError;
      document.body.appendChild(script);
    }

    // Muat data saat halaman pertama kali dibuka
    loadSpreadsheetData();
  </script>
</body>
</html>
